<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顽石经验分享｜顽石智护</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<nav class="top">
  <a class="brand" href="../index.html">顽石智护</a>
  <a class="back" href="index.html">← 返回经验分享</a>
</nav>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">文章</div>
    <h1 id="post-title">加载中...</h1>
    <div class="byline" id="post-meta"></div>
  </div>
</header>
<main class="main">
  <div class="article-wrap">
    <div class="reading">
      <button onclick="document.querySelector('.article').style.fontSize='16px'">小</button>
      <button onclick="document.querySelector('.article').style.fontSize='19px'">中</button>
      <button onclick="document.querySelector('.article').style.fontSize='22px'">大</button>
    </div>
    <article class="article" id="post-body">加载中...</article>
  </div>
</main>
<footer class="footer">顽石经验分享 · 个人经历不代替医疗建议　｜　交流微信：L52425434</footer>
<script>
const params = new URLSearchParams(location.search);
const slug = params.get('slug') || 'als-9-years';
fetch('posts/' + slug + '.md')
  .then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
  .then(md => {
    const parts = md.split('---');
    let body = md;
    if (parts.length >= 3) {
      const meta = {};
      parts[1].split('\n').forEach(line => {
        const m = line.match(/^(\w+):\s*(.+)$/);
        if (m) meta[m[1]] = m[2].replace(/^"|"$/g, '');
      });
      if (meta.title) document.getElementById('post-title').textContent = meta.title;
      if (meta.date) document.getElementById('post-meta').textContent = '作者：顽石　｜　' + meta.date + '　｜　真实经历，不代替医疗建议';
      document.title = meta.title + '｜顽石经验分享';
      body = parts.slice(2).join('---');
    }
    document.getElementById('post-body').innerHTML = marked.parse(body);
  })
  .catch(() => {
    document.getElementById('post-title').textContent = '文章不存在';
    document.getElementById('post-body').innerHTML = '<p>未找到该文章。<a href="index.html">返回列表</a></p>';
  });
</script>
</body>
</html>
