<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顽石经验分享｜顽石智护</title>
<meta name="description" content="顽石与ALS抗争9年的真实经验分享">
<meta property="og:title" content="顽石经验分享｜顽石智护">
<meta property="og:description" content="顽石与ALS抗争9年的真实经验分享">
<meta property="og:type" content="article">
<meta property="og:image" content="https://wanshizhihu.com/assets/social/share-square.png">
<link rel="stylesheet" href="style.css">
<script src="marked.min.js"></script>
</head>
<body class="post-page">
<nav class="top">
  <a class="brand" href="../index.html">顽石智护</a>
  <a class="back" href="index.html">← 返回经验分享</a>
</nav>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">文章</div>
    <h1 id="post-title">加载中...</h1>
    <div class="byline" id="post-meta"></div>
  </div>
</header>
<main class="main">
  <div class="article-wrap">
    <div class="reading">
      <button onclick="document.querySelector('.article').style.fontSize='16px'">小</button>
      <button onclick="document.querySelector('.article').style.fontSize='19px'">中</button>
      <button onclick="document.querySelector('.article').style.fontSize='22px'">大</button>
    </div>
    <article class="article" id="post-body">加载中...</article>
  </div>

  <!-- 产品引流区 -->
  <div class="cta-box">
    <div class="cta-text">
      <h3>顽石智护 · ALS辅助产品</h3>
      <p>9款自研产品，解决口水管理、肌张力疼痛、危机呼救三大难题</p>
    </div>
    <a href="../index.html" class="cta-btn">查看全部产品 →</a>
  </div>

  <!-- 更多文章 -->
  <div class="more-posts">
    <h3 class="section-title">更多经验分享</h3>
    <div id="more-post-list">加载中...</div>
  </div>
</main>
<footer class="footer">顽石经验分享 · 个人经历不代替医疗建议　｜　交流微信：L52425434</footer>
<script>
const params = new URLSearchParams(location.search);
const slug = params.get('slug') || 'als-9-years';

// 加载文章
fetch('posts/' + slug + '.md')
  .then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
  .then(md => {
    const parts = md.split('---');
    let body = md;
    if (parts.length >= 3) {
      const meta = {};
      parts[1].split('\n').forEach(line => {
        const m = line.match(/^(\w+):\s*(.+)$/);
        if (m) meta[m[1]] = m[2].replace(/^"|"$/g, '');
      });
      if (meta.title) document.getElementById('post-title').textContent = meta.title;
      if (meta.date) document.getElementById('post-meta').textContent = '作者：顽石　｜　' + meta.date + '　｜　真实经历，不代替医疗建议';
      if (meta.type) document.querySelector('.eyebrow').textContent = meta.type;
      document.title = meta.title + '｜顽石经验分享';
      document.querySelector('meta[property="og:title"]').setAttribute('content', meta.title);
      if (meta.excerpt) {
        document.querySelector('meta[name="description"]').setAttribute('content', meta.excerpt);
        document.querySelector('meta[property="og:description"]').setAttribute('content', meta.excerpt);
      }
      body = parts.slice(2).join('---');
    }
    document.getElementById('post-body').innerHTML = marked.parse(body);
  })
  .catch(() => {
    document.getElementById('post-title').textContent = '文章不存在';
    document.getElementById('post-body').innerHTML = '<p>未找到该文章。<a href="index.html">返回列表</a></p>';
  });

// 加载更多文章（排除当前文章）
fetch('posts/list.json')
  .then(r => r.json())
  .then(posts => {
    const other = posts.filter(p => p.slug !== slug);
    const container = document.getElementById('more-post-list');
    if (other.length === 0) {
      container.innerHTML = '<p class="hint">更多文章陆续更新中...</p>';
      return;
    }
    container.innerHTML = other.map(p => `
      <a class="feature small" href="post.html?slug=${p.slug}">
        <div class="pill">${p.date}</div>
        <h4>${p.title}</h4>
        <p>${p.excerpt || ''}</p>
      </a>
    `).join('');
  })
  .catch(() => {
    document.getElementById('more-post-list').innerHTML = '<p class="hint">加载失败</p>';
  });
</script>
</body>
</html>
